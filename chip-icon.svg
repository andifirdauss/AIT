<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Ikon chip prosesor">
  <title>Ikon chip prosesor</title>

  <!-- Pin atas -->
  <g fill="#000">
    <rect x="95"  y="22" width="14" height="30" rx="2"/>
    <rect x="119" y="22" width="14" height="30" rx="2"/>
    <rect x="143" y="22" width="14" height="30" rx="2"/>
    <rect x="167" y="22" width="14" height="30" rx="2"/>
    <rect x="191" y="22" width="14" height="30" rx="2"/>
  </g>

  <!-- Pin bawah -->
  <g fill="#000">
    <rect x="95"  y="248" width="14" height="30" rx="2"/>
    <rect x="119" y="248" width="14" height="30" rx="2"/>
    <rect x="143" y="248" width="14" height="30" rx="2"/>
    <rect x="167" y="248" width="14" height="30" rx="2"/>
    <rect x="191" y="248" width="14" height="30" rx="2"/>
  </g>

  <!-- Pin kiri -->
  <g fill="#000">
    <rect x="22" y="95"  width="30" height="14" rx="2"/>
    <rect x="22" y="119" width="30" height="14" rx="2"/>
    <rect x="22" y="143" width="30" height="14" rx="2"/>
    <rect x="22" y="167" width="30" height="14" rx="2"/>
    <rect x="22" y="191" width="30" height="14" rx="2"/>
  </g>

  <!-- Pin kanan -->
  <g fill="#000">
    <rect x="248" y="95"  width="30" height="14" rx="2"/>
    <rect x="248" y="119" width="30" height="14" rx="2"/>
    <rect x="248" y="143" width="30" height="14" rx="2"/>
    <rect x="248" y="167" width="30" height="14" rx="2"/>
    <rect x="248" y="191" width="30" height="14" rx="2"/>
  </g>

  <!-- Badan chip -->
  <rect x="60" y="60" width="180" height="180" rx="18" fill="#000"/>

  <!-- Cincin putih -->
  <rect x="88" y="88" width="124" height="124" rx="4" fill="#fff"/>

  <!-- Die biru: 8 thread (4 kolom x 2 baris) -->
  <g fill="#3B6FD4">
    <rect x="98"  y="98"  width="32" height="32" rx="3"/>
    <rect x="134" y="98"  width="32" height="32" rx="3"/>
    <rect x="170" y="98"  width="32" height="32" rx="3"/>
    <rect x="98"  y="134" width="32" height="32" rx="3"/>
    <rect x="170" y="134" width="32" height="32" rx="3"/>
    <rect x="98"  y="170" width="32" height="32" rx="3"/>
    <rect x="134" y="170" width="32" height="32" rx="3"/>
    <rect x="170" y="170" width="32" height="32" rx="3"/>
  </g>

  <!-- Huruf AIT di tengah (berupa path, tidak bergantung font) -->
  <g fill="none" stroke="#3B6FD4" stroke-width="3" stroke-linejoin="round">
    <path d="M136 157 L141 144 L146 157 M137.8 152.5 H144.2"/>
    <path d="M150.5 143 V157"/>
    <path d="M155 144.5 H164 M159.5 144.5 V157"/>
  </g>
</svg>
